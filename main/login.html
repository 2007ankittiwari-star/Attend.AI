<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance| VIT Bhopal University</title>

<link rel="stylesheet" href="css/auth.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="background">
<div class="grid"></div>
<div class="circle one"></div>
<div class="circle two"></div>
<div class="circle three"></div>
</div>

<div class="container">

<div class="logo">

<div class="logo-box">
VIT
</div>

<h1>Smart Attendance</h1>

<p>VIT Bhopal University</p>

<span>Smart Attendance Management System</span>

</div>

<div class="login-card">

<h2>Professor Login</h2>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
placeholder="professor@vitbhopal.ac.in"
required>

</div>

</div>

<div class="input-group">

<label>Password</label>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<i
class="fa-solid fa-eye togglePassword"
id="togglePassword">
</i>

</div>

</div>

<div class="remember">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button class="login-btn">

Sign In

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<a href="register.html" class="register-btn">

Create New Account

</a>

</div>

<p class="footer">

Powered by AI Face Recognition  • Version 1.0

</p>

</div>

<script src="js/auth.js"></script>

</body>
</html>
